<title>Selim Tarek Card</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a single phone-width card on a deep navy ground; hero seal, credential strip, one gold call to action, quick actions, contact rows. Committed dark look. */
:root{
  --ground:#070D1A;
  --navy:#0C1730;
  --surface:#111D38;
  --line:rgba(201,164,92,.22);
  --gold:#C9A45C;
  --gold-hi:#EBD6A4;
  --ivory:#F2EBDC;
  --muted:#8E99B4;
  --ink:#0A1224;
  --f-display:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(201,164,92,.16), transparent 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(40,70,140,.25), transparent 70%),
    var(--ground);
  color:var(--ivory);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
  -webkit-font-smoothing:antialiased;
}
.card{
  max-width:420px;margin:0 auto;
  display:flex;flex-direction:column;gap:22px;
  background:linear-gradient(180deg, var(--surface), var(--navy) 55%);
  border:1px solid var(--line);
  border-radius:28px;
  padding:20px 20px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(235,214,164,.08);
  position:relative;overflow:hidden;
}
.card::before{ /* fine guilloche texture, like a certificate */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(circle at 50% 18%, transparent 0 9px, rgba(201,164,92,.045) 9px 10px);
  -webkit-mask:linear-gradient(180deg,#000 0,#000 35%,transparent 60%);
          mask:linear-gradient(180deg,#000 0,#000 35%,transparent 60%);
}
.card > *{position:relative}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between}
.mark{font-family:var(--f-display);font-weight:600;letter-spacing:.35em;font-size:13px;color:var(--gold)}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(201,164,92,.08);border:1px solid var(--line);color:var(--gold-hi);
  cursor:pointer;transition:background .2s,transform .2s;
}
.icon-btn:hover{background:rgba(201,164,92,.16)}
.icon-btn:active{transform:scale(.94)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.seal{width:136px;height:136px;position:relative;display:grid;place-items:center;margin-bottom:12px}
.seal::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, var(--gold), #6E5528, var(--gold-hi), #6E5528, var(--gold));
  animation:spin 14s linear infinite;
  filter:drop-shadow(0 0 14px rgba(201,164,92,.45));
}
.seal::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--navy)}
.avatar{
  position:relative;z-index:1;width:120px;height:120px;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 30%, #1C2C52, #0A1430);
  border:1px solid rgba(235,214,164,.25);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.monogram{font-family:var(--f-display);font-weight:600;font-size:48px;letter-spacing:.04em;color:var(--gold-hi);line-height:1}
@keyframes spin{to{transform:rotate(360deg)}}

.name{font-family:var(--f-display);font-weight:600;font-size:42px;line-height:1.05;letter-spacing:.01em;margin:0;text-wrap:balance}
.role{
  margin-top:8px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;
}
.bio{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:34ch;text-wrap:balance}

/* credentials strip */
.creds{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-block:1px solid var(--line);padding-block:14px;
}
.cred{text-align:center;display:flex;flex-direction:column;gap:4px}
.cred + .cred{border-left:1px solid var(--line)}
.cred b{font-family:var(--f-display);font-weight:600;font-size:27px;color:var(--gold-hi);line-height:1;font-variant-numeric:tabular-nums lining-nums}
.cred span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* CTAs */
.ctas{display:flex;flex-direction:column;gap:10px}
.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:58px;border-radius:18px;border:0;cursor:pointer;
  font-family:var(--f-body);font-weight:600;font-size:16.5px;letter-spacing:.02em;color:var(--ink);
  background:linear-gradient(135deg, var(--gold-hi), var(--gold) 45%, #A9853F);
  box-shadow:0 10px 30px rgba(201,164,92,.35), inset 0 1px 0 rgba(255,255,255,.45);
  position:relative;overflow:hidden;transition:transform .15s, box-shadow .2s;
}
.cta::after{
  content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  animation:sheen 4.5s ease-in-out infinite 1.2s;
}
@keyframes sheen{0%{left:-60%}35%,100%{left:130%}}
.cta:hover{box-shadow:0 14px 36px rgba(201,164,92,.48), inset 0 1px 0 rgba(255,255,255,.45)}
.cta:active{transform:scale(.985)}
.cta-ghost{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:50px;border-radius:16px;cursor:pointer;
  font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--gold-hi);
  background:transparent;border:1px solid rgba(201,164,92,.45);transition:background .2s;
}
.cta-ghost:hover{background:rgba(201,164,92,.08)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 4px 12px;border-radius:18px;text-decoration:none;color:var(--ivory);
  background:rgba(255,255,255,.025);border:1px solid var(--line);cursor:pointer;
  font-family:var(--f-body);font-size:12.5px;font-weight:500;
  transition:background .2s, border-color .2s, transform .15s;
}
.qa:hover{background:rgba(201,164,92,.09);border-color:rgba(201,164,92,.45)}
.qa:active{transform:scale(.96)}
.qa .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);background:rgba(201,164,92,.1)}

/* contact rows */
.section-label{font-size:11px;letter-spacing:.24em;color:var(--gold);margin:0 0 -10px;font-weight:500;text-transform:uppercase}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.row .ic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--gold-hi);background:rgba(201,164,92,.08)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .k{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.row .v{font-size:15px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all;font-variant-numeric:tabular-nums}
.mini{
  flex:none;height:34px;padding:0 14px;border-radius:10px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--gold-hi);
  font-family:var(--f-body);font-size:13px;display:inline-flex;align-items:center;text-decoration:none;
}
.mini:hover{background:rgba(201,164,92,.1)}

:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(3,6,14,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  animation:fade .2s ease;
}
.sheet{
  width:100%;max-width:380px;max-height:100%;overflow:auto;
  background:linear-gradient(180deg, var(--surface), var(--navy));
  border:1px solid var(--line);border-radius:26px;padding:18px 18px 22px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:rise .28s cubic-bezier(.2,.8,.2,1);
}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:26px;color:var(--gold-hi);font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.tab{
  height:38px;border-radius:10px;border:0;cursor:pointer;background:transparent;color:var(--muted);
  font-family:var(--f-body);font-size:14px;font-weight:500;
}
.tab[aria-selected="true"]{background:var(--gold);color:var(--ink)}
.qr-frame{
  align-self:center;width:min(270px,100%);aspect-ratio:1;max-width:100%;
  padding:12px;border-radius:20px;background:var(--ivory);
  box-shadow:0 0 0 1px var(--gold), 0 0 0 7px rgba(201,164,92,.18), 0 0 40px rgba(201,164,92,.25);
  display:grid;place-items:center;
}
.qr-frame svg{width:100%;height:100%;display:block}
.qr-note{margin:0;text-align:center;color:var(--muted);font-size:14px;text-wrap:balance}
.qr-note strong{color:var(--ivory);font-weight:500}
.qr-err{color:var(--ink);font-size:13px;text-align:center;padding:12px}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:60;max-width:calc(100% - 32px);
  background:var(--ivory);color:var(--ink);border-radius:14px;padding:10px 16px;
  font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:toastIn .25s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

@media (max-width:360px){
  .name{font-size:36px}
  .quick{gap:8px}
  .qa{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  .seal::before,.cta::after{animation:none}
  .overlay,.sheet,.toast{animation:none}
}
</style>

</head>

/* ================================== */

const $ = id => document.getElementById(id);
const digits = CONFIG.phone.replace(/[^\d+]/g, "");
const waNum = digits.replace(/^\+/, "");
const inViewer = !!(window.claude && typeof window.claude.use === "function");

// fill page
$("phoneText").textContent = CONFIG.phone;
$("emailText").textContent = CONFIG.email;
$("qaCall").href = "tel:" + digits;
$("qaWa").href = "https://wa.me/" + waNum + "?text=" + encodeURIComponent("Hi Selim, I found you through your digital card.");
$("qaLi").href = CONFIG.linkedin;
$("qaFb").href = CONFIG.facebook;
if (CONFIG.photo) {
  const img = new Image(); img.alt = CONFIG.firstName + " " + CONFIG.lastName; img.src = CONFIG.photo;
  $("avatar").replaceChildren(img);
}

// toast
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}

// copy
document.querySelectorAll("[data-copy]").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.copy;
    const val = key === "phone" ? CONFIG.phone : CONFIG.email;
    const el = key === "phone" ? $("phoneText") : $("emailText");
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(el);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast("Text selected, copy it from the menu");
    };
    try {
      navigator.clipboard.writeText(val).then(() => toast("Copied"), fallback);
    } catch(e){ fallback(); }
  });
});

// vCard
function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,"); }
function buildVCard(){
  return [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:" + esc(CONFIG.lastName) + ";" + esc(CONFIG.firstName) + ";;;",
    "FN:" + esc(CONFIG.firstName + " " + CONFIG.lastName),
    "TITLE:" + esc(CONFIG.title),
    "TEL;TYPE=CELL,VOICE:" + digits,
    "EMAIL;TYPE=INTERNET:" + CONFIG.email,
    "URL:" + CONFIG.linkedin,
    "URL:" + CONFIG.facebook,
    "END:VCARD"
  ].join("\r\n");
}
const fileName = CONFIG.firstName + "-" + CONFIG.lastName + ".vcf";

let downloadsP = null;
if (inViewer) { try { downloadsP = window.claude.use("downloads"); } catch(e){ downloadsP = Promise.resolve(null); } }

$("saveBtn").addEventListener("click", async () => {
  const vcf = buildVCard();
  if (!inViewer) {
    // Self-hosted page: direct .vcf download, phones open it as a contact
    const blob = new Blob([vcf], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fileName; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast("Open the file to add the contact");
    return;
  }
  // Inside the Claude viewer: try the platform save, else show the contact QR
  try {
    const dl = await downloadsP;
    if (dl) {
      await dl.save({ filename: fileName, data: vcf });
      toast("Open the file to add the contact");
      return;
    }
  } catch(err) {
    if (err && err.code === "declined") return;
  }
  openQR("contact", true);
});

// QR
function qrSvg(text){
  if (typeof qrcode !== "function") return null;
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M"); qr.addData(text, "Byte"); qr.make();
  const n = qr.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r,c)) d += "M" + c + " " + r + "h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 ' + (n+2) + ' ' + (n+2) + '" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect x="-1" y="-1" width="' + (n+2) + '" height="' + (n+2) + '" fill="#F2EBDC"/><path d="' + d + '" fill="#0A1224"/></svg>';
}
function cardLink(){
  if (!inViewer && /^https?:/.test(location.href)) return location.href.split("#")[0];
  return CONFIG.cardUrl || CONFIG.linkedin;
}
let lastFocus = null;
function renderTab(which, fromSave){
  $("tabLink").setAttribute("aria-selected", which === "link");
  $("tabContact").setAttribute("aria-selected", which === "contact");
  const svg = qrSvg(which === "link" ? cardLink() : buildVCard());
  $("qrBox").innerHTML = svg || '<div class="qr-err">The QR generator did not load. Reopen the page.</div>';
  $("qrNote").innerHTML = which === "link"
    ? "Point your phone camera at the code to <strong>open this card</strong>."
    : (fromSave
        ? "File downloads are blocked in this window. <strong>Scan with your phone camera</strong> and tap Add Contact."
        : "Scan with your phone camera to <strong>save name, number and email</strong> straight to contacts.");
}
function openQR(which, fromSave){
  lastFocus = document.activeElement;
  renderTab(which || "link", fromSave);
  $("qrModal").hidden = false;
  $("qrClose").focus();
}
function closeQR(){
  $("qrModal").hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$("qrOpenTop").addEventListener("click", () => openQR("link"));
$("qrOpenMain").addEventListener("click", () => openQR("link"));
$("qrClose").addEventListener("click", closeQR);
$("tabLink").addEventListener("click", () => renderTab("link"));
$("tabContact").addEventListener("click", () => renderTab("contact"));
$("qrModal").addEventListener("click", e => { if (e.target === $("qrModal")) closeQR(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("qrModal").hidden) closeQR(); });

// tel: links are not reliable inside the viewer; copy the number as backup
$("qaCall").addEventListener("click", () => {
  if (inViewer) { try { navigator.clipboard.writeText(CONFIG.phone).then(() => toast("Number copied: " + CONFIG.phone), ()=>{}); } catch(e){} }
});
</script>
