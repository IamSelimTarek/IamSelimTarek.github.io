<title>Selim Tarek · L&amp;D Consultant, Trainer &amp; Career Coach</title>

<style>
:root{--ink:#1C2628;--sage:#3F7A68;--sage-lt:#CFDDD5;--bg:#EEEBE4;--dark:#101716;--line:#26312E;--muted:#8A9893}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--dark)}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:#fff;background:var(--dark);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:440px;margin:0 auto;background:var(--dark);position:relative}

/* hero */
.hero{position:relative;height:590px;overflow:hidden;
  background:radial-gradient(60% 45% at 30% 38%,rgba(63,122,104,.55),transparent 70%),radial-gradient(50% 40% at 82% 68%,rgba(110,130,120,.32),transparent 70%),var(--dark)}
.hero img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:540px;width:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:270px;background:linear-gradient(180deg,transparent,var(--dark) 82%)}
.txt{position:absolute;left:24px;bottom:22px;z-index:2}
.txt h1{font-size:46px;line-height:1;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;max-width:240px}
.chip{background:var(--sage-lt);color:var(--ink);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px}
.chip.alt{background:transparent;color:var(--sage-lt);box-shadow:inset 0 0 0 1px rgba(207,221,213,.55)}

/* body */
.body{padding:8px 24px 40px}
.sub{color:#B4BFBB;font-size:15px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.stats div{text-align:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:22px;color:#fff;font-weight:600;letter-spacing:0;margin-bottom:2px}
.btn{display:flex;width:100%;border:0;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;font-weight:600;font-size:15.5px;margin-top:20px;background:var(--bg);color:var(--ink);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.985)}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.ico{height:54px;border-radius:14px;display:grid;place-items:center;background:#1B2523;border:1px solid #2A3633;color:#DDE6E2;transition:background .2s,border-color .2s}
.ico:hover{background:#22302C;border-color:var(--sage)}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.qrb{display:flex;align-items:center;gap:10px;height:58px;padding:0 14px;border-radius:14px;border:1px solid var(--sage);background:rgba(63,122,104,.14);color:var(--sage-lt);text-align:left;transition:background .2s}
.qrb:hover{background:rgba(63,122,104,.26)}
.qrb span{font-weight:600;font-size:14px;color:#fff;line-height:1.2}
.qrb i{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:#9FB3AB}
.foot{margin-top:26px;text-align:center;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.12em;color:#56635F}

/* QR sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,9,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:520px){.overlay{align-items:center}}
.sheet{width:100%;max-width:440px;background:var(--bg);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 24px 30px;animation:up .25s ease-out}
@media (min-width:520px){.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:20px;font-weight:700}
.close{width:40px;height:40px;border-radius:50%;border:1px solid #D3CEC3;background:#fff;display:grid;place-items:center;color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#E0DCD3;border-radius:12px;padding:4px;margin-top:16px}
.tab{border:0;background:transparent;height:40px;border-radius:9px;font-weight:600;font-size:14px;color:#5A6461}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qr-frame{margin:20px auto 0;width:min(260px,72vw);aspect-ratio:1;background:#fff;border-radius:16px;padding:14px}
.qr-frame svg{width:100%;height:100%;display:block}
.qr-note{text-align:center;margin-top:14px;font-size:14px;color:#4E5856;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:30;background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>
</head>

/* ================================== */
const $ = id => document.getElementById(id);
const digits = CONFIG.phone.replace(/[^\d+]/g, "");
$("lnCall").href = "tel:" + digits;
$("lnWa").href = "https://wa.me/" + digits.replace(/^\+/, "") + "?text=" + encodeURIComponent(CONFIG.waMessage);
$("lnLi").href = CONFIG.linkedin;
$("lnFb").href = CONFIG.facebook;
$("lnMail").href = "mailto:" + CONFIG.email;

let tt;
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }

function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,"); }
function vcard(withPhoto){
  const L = [
    "BEGIN:VCARD","VERSION:3.0",
    "N:" + esc(CONFIG.lastName) + ";" + esc(CONFIG.firstName) + ";;;",
    "FN:" + esc(CONFIG.firstName + " " + CONFIG.lastName),
    "TITLE:" + esc(CONFIG.title),
    "TEL;TYPE=CELL,VOICE:" + digits,
    "EMAIL;TYPE=INTERNET:" + CONFIG.email,
    "URL:" + CONFIG.cardUrl
  ];
  if (withPhoto) {
    L.push("URL:" + CONFIG.linkedin);
    if (VCARD_PHOTO && VCARD_PHOTO.indexOf("__") !== 0) L.push("PHOTO;ENCODING=b;TYPE=JPEG:" + VCARD_PHOTO);
  }
  L.push("END:VCARD");
  return L.join("\r\n");
}

$("saveBtn").addEventListener("click", () => {
  const blob = new Blob([vcard(true)], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = CONFIG.firstName + "-" + CONFIG.lastName + ".vcf";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast("Open the file to add the contact");
});

/* QR */
function qrSvg(text){
  if (typeof qrcode !== "function") return null;
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q = qrcode(0, "M"); q.addData(text, "Byte"); q.make();
  const n = q.getModuleCount(); let d = "";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += "M"+c+" "+r+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="'+d+'" fill="#1C2628"/></svg>';
}
function render(which){
  $("tabLink").setAttribute("aria-selected", which==="link");
  $("tabContact").setAttribute("aria-selected", which==="contact");
  const svg = qrSvg(which==="link" ? CONFIG.cardUrl : vcard(false));
  $("qrBox").innerHTML = svg || '<p style="padding:40px 10px;text-align:center">QR could not load. Refresh the page.</p>';
  $("qrNote").innerHTML = which==="link"
    ? "Point your phone camera at the code to <strong>open this card</strong>."
    : "Scan with your phone camera to <strong>save my name, number and email</strong>.";
}
let lastFocus=null;
function openQR(which){ lastFocus=document.activeElement; render(which); $("qrModal").hidden=false; $("qrClose").focus(); }
function closeQR(){ $("qrModal").hidden=true; if(lastFocus) lastFocus.focus(); }
document.querySelectorAll("[data-qr]").forEach(b => b.addEventListener("click", () => openQR(b.dataset.qr)));
$("tabLink").addEventListener("click", () => render("link"));
$("tabContact").addEventListener("click", () => render("contact"));
$("qrClose").addEventListener("click", closeQR);
$("qrModal").addEventListener("click", e => { if (e.target === $("qrModal")) closeQR(); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("qrModal").hidden) closeQR(); });
</script>
